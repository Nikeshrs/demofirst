<table class="table table-striped table-hover table-bordered align-middle text-center">
    <thead class="table-dark">
        <tr>
            <td>S.NO</td>
            <td>FirstName</td>
            <td>LastName</td>
            <td>Email</td>
            <td>Phone</td>
            <td>Date</td>
            <td>People</td>
            <td>Tour</td>
            <td>ContactType</td>
        </tr>
        
    </thead>
    <tbody>
        @for(item of allDbData();track $index){
            <tr>
                <td>{{$index+1}}</td>
                <td>{{item.firstName}}</td>
                <td>{{item.lastName}}</td>
                <td>{{item.email}}</td>
                <td>{{item.phone}}</td>
                <td>{{item.date}}</td>
                <td>{{item.people}}</td>
                <td>{{item.tour}}</td>
                <td>{{item.contactType}}</td>
                <td><button (click)="updateId(item.id)" >Edit</button></td>
                <td><button (click)="deleteRecord(item.id)">Delete</button></td>
            
            </tr>
        }
        

    </tbody>
    
</table>
