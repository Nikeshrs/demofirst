<table class="table table-striped table-hover table-bordered align-middle text-center">
    <thead class="table-dark">
        <tr>
            <td>S.NO</td>
            <td>Name</td>
            <td>Email</td>
            <td>Phone</td>
            <td>No.of Adults</td>
            <td>No.of Children</td>
            <td>Check-in Date</td>
            <td>Check-out Date</td>
        </tr>
    </thead>
    <tbody>
        @for(item of allRoomDbData();track $index){
            <tr>
                <td>{{$index+1}}</td>
                <td>{{item.name}}</td>
                <td>{{item.email}}</td>
                <td>{{item.phone}}</td>
                <td>{{item.children}}</td>
                <td>{{item.adults}}</td>
                <td>{{item.indate}}</td>
                <td>{{item.outdate}}</td>
                <td><button (click)="updateRoomId(item.id)" >Edit</button></td>
                <td><button (click)="deleteRoomRecord(item.id)">Delete</button></td>
            
            </tr>
        }
        

    </tbody>
</table>
